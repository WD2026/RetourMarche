# ────────────────────────────────────────────────────────────────────────────
# Workflow 4 – Code Quality & Standards : Checkstyle
#
# Checkstyle enforces Java coding conventions:
#   • Naming conventions (classes, methods, variables, constants)
#   • Import order and unused imports
#   • Javadoc presence on public APIs
#   • Line length, whitespace, brace style
#   • Magic numbers, empty blocks, cyclomatic complexity
#
# Config file: .github/checkstyle.xml (Google Style + project adjustments)
# Results are uploaded as a GitHub annotation (stdout) and as a build artifact.
# ────────────────────────────────────────────────────────────────────────────

name: "Quality – Checkstyle Code Standards"

on:
  push:
    branches: [ "main", "master"]
    paths:
      - "**/*.java"
      - "pom.xml"
      - ".github/checkstyle.xml"
      - ".github/workflows/checkstyle.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "**/*.java"
      - "pom.xml"
      - ".github/checkstyle.xml"
      - ".github/workflows/checkstyle.yml"

concurrency:
  group: checkstyle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write         # allows the action to post inline PR annotations
  pull-requests: write  # allows posting a summary comment on PRs

jobs:
  checkstyle:
    name: Checkstyle Analysis
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 ────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml

      # ── 3. Run Checkstyle via Maven plugin ────────────────────────────────
      # The maven-checkstyle-plugin is invoked without modifying pom.xml.
      # configLocation points to our custom ruleset in .github/checkstyle.xml.
      # failsOnError=false: never block the build; violations appear as warnings.
      # Set to true once the codebase is clean enough to enforce the gate.
      # Jim: Maven is downloading a HUGE number of depend artifacts every time
      # this is run.  Reduce this by using one or both of these:
      # -Dcheckstyle.skipModules=true    
      # -DskipTests
      # Another choice is to run the Checkstyle CLI action instead of mvn action
      # Checkstyle CLI Action downloads only Checkstyle (15MB).
      - name: Run Checkstyle
        run: |
          ./mvnw -B -ntp checkstyle:checkstyle \
            -Dcheckstyle.skipModules=true \
            -DskipTests \
            -Dcheckstyle.config.location=.github/checkstyle.xml \
            -Dcheckstyle.failsOnError=false \
            -Dcheckstyle.violationSeverity=warning \
            -Dcheckstyle.outputFile=target/checkstyle-result.xml \
            -Dcheckstyle.outputFileFormat=xml

      # ── 4. Publish results as PR annotations / check run ─────────────────
      - name: Publish Checkstyle annotations
        if: always()
        uses: jwgmeligmeyling/checkstyle-github-action@v1.2
        with:
          path: target/checkstyle-result.xml
          name: Checkstyle Violations
          title: Checkstyle Report

      # ── 5. Keep XML report as downloadable artifact ───────────────────────
      - name: Archive Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          retention-days: 30
