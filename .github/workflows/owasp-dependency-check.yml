# ────────────────────────────────────────────────────────────────────────────
# Workflow 2 – Dependency Vulnerability Check : OWASP Dependency-Check
#
# OWASP Dependency-Check scans all Maven dependencies declared in pom.xml
# and cross-references them against the NVD (National Vulnerability Database).
# It reports CVEs found in libraries such as Spring Boot, PostgreSQL driver,
# Stripe, Resilience4j, etc.
#
# Results: HTML report (artifact) + SARIF upload to GitHub Security tab.
# ────────────────────────────────────────────────────────────────────────────

name: "Security – OWASP Dependency-Check"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Run weekly so new CVEs are caught even without code changes
  schedule:
    - cron: '0 4 * * 1'   # every Monday at 04:00 UTC

permissions:
  contents: read
  security-events: write   # upload SARIF

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── 3. Run OWASP Dependency-Check via Maven plugin ───────────────────
      # The plugin downloads the NVD feed on first run (cached below).
      # failBuildOnCVSS=11 means the build never hard-fails (report only);
      # lower it to 7 or 8 in production to enforce a quality gate.
      - name: Run OWASP Dependency-Check
        env:
          # Provide an NVD API key to avoid rate limiting (set in repo secrets)
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn --batch-mode org.owasp:dependency-check-maven:9.1.0:check \
            -DfailBuildOnCVSS=11 \
            -Dformat=ALL \
            -DnvdApiKey=${NVD_API_KEY} \
            -DsuppressionFiles=.github/owasp-suppressions.xml \
            -DoutputDirectory=target/dependency-check

      # ── 4. Upload HTML + SARIF reports as artifacts ───────────────────────
      - name: Archive Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: |
            target/dependency-check/dependency-check-report.html
            target/dependency-check/dependency-check-report.sarif
          retention-days: 30

      # ── 5. Upload SARIF to GitHub Security tab ────────────────────────────
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check/dependency-check-report.sarif
          category: owasp-dependency-check
