version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: shop-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shop-network

  app:
    build: .
    container_name: shop-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/shop}
      SPRING_DATASOURCE_DRIVER: ${SPRING_DATASOURCE_DRIVER:-org.postgresql.Driver}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Stripe secret key must be set}
    networks:
      - shop-network

  nginx:
    image: nginx:alpine
    container_name: shop-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - shop-network

  dozzle:
    image: amir20/dozzle:latest
    container_name: shop-dozzle
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_ENABLE_SHELL=true
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle_data:/data
    networks:
      - shop-network

  prometheus:
    image: prom/prometheus:latest
    container_name: shop-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      # Not necessary to expose Prometheus port if Grafana is only service reading it
      - "9090:9090"
    networks:
      - shop-network

  grafana:
    image: grafana/grafana:latest
    container_name: shop-grafana
    ports:
      - "${GRAFANA_HTTP_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - shop-network
    depends_on:
      - prometheus

networks:
  shop-network:
    driver: bridge

volumes:
  postgres_data:
  dozzle_data:
