<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Détails de la commande | RetourMarché</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <th:block th:replace="~{fragments/head :: header}"></th:block>
    <style>
        .bouton-contour-sombre-sans-survol:hover {
            background-color: transparent !important;
            color: #212529 !important;
            border-color: #212529 !important;
        }
    </style>
</head>

<body class="bg-light">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="d-flex align-items-center mb-4">
                    <a href="/profile"
                        class="btn btn-outline-dark rounded-circle me-3 bouton-contour-sombre-sans-survol">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <h2 class="mb-0 fw-bold">Détails de la commande</h2>
                </div>

                <div class="card shadow-sm border-0 rounded-4 mb-4">
                    <div class="card-body p-4">
                        <div class="row">
                            <div class="col-md-6">
                                <h5 class="fw-bold mb-3">Informations de commande</h5>
                                <p class="mb-1 text-muted">Date : <span class="fw-bold text-dark"
                                        th:text="${#temporals.format(order.orderDate, 'dd MMMM yyyy à HH:mm')}">01
                                        Janvier 2024</span></p>
                            </div>
                            <div class="col-md-6 mt-4 mt-md-0">
                                <h5 class="fw-bold mb-3">Adresse de livraison</h5>
                                <p class="mb-0 text-muted">
                                    <span th:text="${order.firstName} + ' ' + ${order.lastName}">Jean Dupont</span><br>
                                    <span th:text="${order.address}">123 Rue de la Paix</span><br>
                                    <span th:text="${order.zip} + ' ' + ${order.city}">75000 Paris</span><br>
                                    <span th:text="${order.country}">France</span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Articles commandés</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th scope="col" class="ps-4">Produit</th>
                                        <th scope="col" class="text-center">Quantité</th>
                                        <th scope="col" class="text-end pe-4">Prix total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${order.items}">
                                        <td class="ps-4 py-3">
                                            <div class="d-flex align-items-center">
                                                <img th:src="${item.product.imageUrl}" alt="Product"
                                                    class="rounded border me-3"
                                                    style="width: 50px; height: 50px; object-fit: contain; background: #fff;">
                                                <div>
                                                    <h6 class="mb-0 fw-bold" th:text="${item.product.name}">Nom du
                                                        produit</h6>
                                                    <small class="text-muted"
                                                        th:if="${item.insuranceType != null and item.insuranceType.name() != 'NONE'}">
                                                        <i class="bi bi-shield-check text-primary me-1"></i>
                                                        <span th:text="${item.insuranceType.label}">Assurance</span>
                                                        (<span
                                                            th:text="${#numbers.formatDecimal(item.insuranceType.price, 1, 2)} + ' €'">+10€</span>)
                                                    </small>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="text-center">
                                            <span class="badge bg-light text-dark border"
                                                th:text="'x' + ${item.quantity}">x1</span>
                                        </td>
                                        <td class="text-end pe-4 fw-bold">
                                            <span
                                                th:with="itemTotal=${(item.price * item.quantity) + (item.insuranceType != null ? item.insuranceType.price : 0)}"
                                                th:text="${#numbers.formatDecimal(itemTotal, 1, 2)} + ' €'">99.99
                                                €</span>
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot class="bg-light">
                                    <tr>
                                        <td colspan="2" class="text-end fw-bold py-3">Total</td>
                                        <td class="text-end pe-4 fw-bold py-3 fs-5"
                                            th:text="${#numbers.formatDecimal(order.totalPrice, 1, 2)} + ' €'">100.00 €
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/head :: footer"></footer>

</body>

</html>
