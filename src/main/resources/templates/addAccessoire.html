<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Accessoire</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <th:block th:replace="~{fragments/head :: header}"></th:block>
</head>

<body>
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2 class="mb-4">Ajouter un accessoire</h2>

                <form th:action="@{/addAccessoire}" th:object="${accessoire}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Nom</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Ex: Coque Silicone"
                                required />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Type</label>
                            <select th:field="*{type}" class="form-select">
                                <option th:each="t : ${types}" th:value="${t.name()}" th:text="${t}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Prix</label>
                            <div class="input-group">
                                <input type="number" step="0.01" th:field="*{price}" class="form-control"
                                    placeholder="0.00" required />
                                <span class="input-group-text">€</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock</label>
                            <input type="number" th:field="*{stock}" class="form-control" placeholder="Quantité"
                                required />
                        </div>

                        <div class="col-12">
                            <label class="form-label">URL Image</label>
                            <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://..."
                                required />
                        </div>

                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Smartphones compatibles (Optionnel)</label>
                            <div class="border rounded p-3 bg-white" style="max-height: 200px; overflow-y: auto;">
                                <div class="row row-cols-1 row-cols-md-2 g-2">
                                    <div th:each="smartphone : ${smartphones}" class="col">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" th:value="${smartphone.id}"
                                                th:field="*{smartphones}" th:id="${'smartphone_' + smartphone.id}" />
                                            <label class="form-check-label small"
                                                th:for="${'smartphone_' + smartphone.id}"
                                                th:text="${smartphone.brand + ' ' + smartphone.name}"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-dark">Enregistrer</button>
                        <a th:href="@{/dashboard}" class="btn btn-link text-dark text-decoration-none ms-2">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
