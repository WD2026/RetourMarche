<div th:fragment="recap(isCheckout)" class="card border-0 rounded-4 p-4 shadow-lg bg-white sticky-top"
    style="top: 100px;">
    <h4 class="fw-bold mb-4">Récapitulatif</h4>

    <div class="mb-3" id="recap-items">
        <div th:each="item : ${cartItems}" class="mb-3">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <img th:src="${item.product.imageUrl}" th:alt="${item.product.name}" class="rounded border me-2"
                        style="width: 40px; height: 40px; object-fit: contain; background: #fff;">
                    <div class="d-flex flex-column">
                        <span class="text-muted small fw-bold" th:text="${item.product.name}">Produit</span>
                        <span class="text-muted x-small" style="font-size: 0.75rem;"
                            th:text="'x' + ${item.quantity}">x1</span>
                    </div>
                </div>
                <span class="fw-semibold small"
                    th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 1, 2)} + ' €'">Prix</span>
            </div>

            <!-- Insurance Line -->
            <div th:if="${item.insuranceType != null and item.insuranceType.name() != 'NONE'}"
                class="d-flex align-items-center justify-content-between mt-1 ms-5 ps-2 border-start border-2">
                <span class="text-muted x-small fst-italic" style="font-size: 0.75rem;">
                    <i class="bi bi-shield-check me-1 text-primary"></i>
                    <span th:text="${item.insuranceType.label}">Assurance</span>
                </span>
                <span class="fw-semibold x-small text-muted" style="font-size: 0.75rem;"
                    th:text="${#numbers.formatDecimal(item.insuranceType.price, 1, 2)} + ' €'">Prix Assurance</span>
            </div>
        </div>
    </div>

    <hr class="my-3 text-muted opacity-25">

    <div class="d-flex justify-content-between mb-2 text-muted">
        <span>Sous-total</span>
        <span th:text="${#numbers.formatDecimal(totalPrice, 1, 2)} + ' €'">0,00 €</span>
    </div>
    <div class="d-flex justify-content-between mb-2 text-muted">
        <span>Livraison</span>
        <span class="text-success">Offerte</span>
    </div>

    <div th:if="${tradeInDiscount != null}" class="d-flex justify-content-between mb-2 text-success">
        <span>
            Reprise ancien appareil
            <a th:href="@{/basket/removeTradeIn}" class="text-danger ms-1 text-decoration-none"
                title="Supprimer la reprise">
                <i class="bi bi-x-circle"></i>
            </a>
        </span>
        <span th:text="'- ' + ${#numbers.formatDecimal(tradeInDiscount, 1, 2)} + ' €'">- 0,00 €</span>
    </div>

    <hr class="my-3 text-muted opacity-25">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <span class="fw-bold fs-5">Total TTC</span>
        <div class="text-end">
            <span th:if="${promoApplied}" class="text-muted text-decoration-line-through me-2"
                th:text="${#numbers.formatDecimal(totalPrice, 1, 2)} + ' €'"></span>
            <span class="fw-bold fs-4"
                th:text="${promoApplied ? discountedPrice : #numbers.formatDecimal(totalPrice, 1, 2)} + ' €'">0,00
                €</span>
        </div>
    </div>

    <a th:if="${!isCheckout}" th:href="@{/basket/checkout}"
        class="btn btn-dark w-100 rounded-pill py-3 fw-bold shadow-sm bouton-sans-survol"
        style="letter-spacing: 0.5px;">
        Passer commande
    </a>

    <!-- Promo Code Section -->
    <div class="mt-4" th:if="${!isCheckout}">
        <form th:action="@{/basket/applyPromo}" method="post" class="input-group">
            <input type="text" name="code" class="form-control rounded-start-pill" placeholder="Code promo"
                aria-label="Code promo">
            <button class="btn btn-outline-secondary rounded-end-pill bouton-contour-sans-survol"
                type="submit">Appliquer</button>
        </form>
        <div th:if="${promoApplied}" class="text-success small mt-2">
            <i class="bi bi-check-circle-fill me-1"></i> Code "JEE" appliqué : -10%
        </div>
    </div>

    <div class="mt-4 text-center">
        <p class="small text-muted mb-2">Paiement 100% sécurisé</p>
        <div class="d-flex justify-content-center gap-2 opacity-50">
            <i class="bi bi-credit-card-2-front fs-4"></i>
            <i class="bi bi-paypal fs-4"></i>
            <i class="bi bi-apple fs-4"></i>
        </div>
    </div>
</div>
