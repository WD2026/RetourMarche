<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #afc9e4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #000;
        }

        .bouton-sans-survol:hover {
            background-color: #212529 !important;
            border-color: #212529 !important;
            color: #fff !important;
            transform: none !important;
        }

        .bouton-contour-sans-survol:hover {
            background-color: transparent !important;
            border-color: #6c757d !important;
            color: #6c757d !important;
            transform: none !important;
        }
    </style>
</head>

<header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="/LogoRetourMarché3.png" alt="Logo Retour Marché" class="img-fluid" style="max-height: 90px;">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Accueil</a>
                    </li>

                    <th:block th:if="${user != null}">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userMenu"
                                role="button" data-bs-toggle="dropdown" aria-expanded="false">

                                <div class="avatar me-2">
                                    <span th:text="${user.nom.substring(0,1).toUpperCase()}"></span>
                                </div>
                            </a>

                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                                <li>
                                    <h6 class="dropdown-header" th:text="${user.prenom + ' ' + user.nom}"></h6>
                                </li>

                                <li>
                                    <hr class="dropdown-divider">
                                </li>

                                <li th:if="${user.role == 'ADMIN'}">
                                    <a class="dropdown-item" href="/dashboard">Dashboard</a>
                                </li>

                                <li>
                                    <a class="dropdown-item" href="/profile">Mon profil</a>
                                </li>

                                <li>
                                    <hr class="dropdown-divider">
                                </li>

                                <li>
                                    <a class="dropdown-item" href="/logout">Déconnexion</a>
                                </li>
                            </ul>
                        </li>
                    </th:block>

                    <th:block th:if="${user == null}">
                        <li class="nav-item">
                            <a class="nav-link" href="/login">
                                <img src="/icones/connexion.png" alt="connexion" width="35">
                            </a>
                        </li>
                    </th:block>

                    <li class="nav-item">
                        <a class="nav-link" href="/basket">
                            <img src="/icones/panier.png" alt="panier" width="32">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<footer class="container-fluid bg-light text-center p-3 mt-5">
    <p>&copy; <span id="year">2025</span> RetourMarché - Tous droits réservés</p>
    <div class="d-flex justify-content-center">
        <h2 class="h6 me-3 ">Suivez-nous sur:</h2>
        <ul class="list-inline">
            <li class="list-inline-item"><a href="https://www.facebook.com/backmarket/?locale=fr_FR"><img
                        src="https://front-office.statics.backmarket.com/4e43c08f125069d3c15a15fc60864b4b9c45df57/img/socials/facebook-light.svg"
                        alt="Facebook-link"></a></li>
            <li class="list-inline-item"><a href="https://www.instagram.com/backmarket/"><img
                        src="https://front-office.statics.backmarket.com/4e43c08f125069d3c15a15fc60864b4b9c45df57/img/socials/instagram-light.svg"
                        alt="Instagram-link"></a></li>
            <li class="list-inline-item"><a href="https://fr.linkedin.com/company/back-market"><img
                        src="https://front-office.statics.backmarket.com/4e43c08f125069d3c15a15fc60864b4b9c45df57/img/socials/linkedin-light.svg"
                        alt="Linkedin-link"></a></li>
            <li class="list-inline-item"><a href="https://www.twitter.com/back_market"><img
                        src="https://front-office.statics.backmarket.com/4e43c08f125069d3c15a15fc60864b4b9c45df57/img/socials/twitter-light.svg"
                        alt="Twitter-link"></a></li>
        </ul>
    </div>
</footer>
