<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Erreur Serveur - Retour Marche</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; text-align: center; padding: 50px; }
        h1 { font-size: 100px; margin: 0; color: #ffc107; }
        p { font-size: 24px; }
        .error-details { font-family: monospace; background: #eee; padding: 10px; border-radius: 5px; margin-top: 20px; word-wrap: break-word; }
        a { text-decoration: none; color: #007bff; font-weight: bold; }
        .container { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <p>Une erreur inattendue s'est produite sur notre serveur.</p>
        <p>Nous travaillons pour résoudre le problème. Veuillez réessayer plus tard.</p>
        <div class="error-details" th:if="${error}">
            <p th:text="${error}"></p>
        </div>
        <p><a href="/">Retourner à l'accueil</a></p>
    </div>
</body>
</html>
