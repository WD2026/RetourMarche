<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un smartphone</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <th:block th:replace="~{fragments/head :: header}"></th:block>
</head>

<body>
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2 class="mb-4">Ajouter un smartphone</h2>

                <form th:action="@{/addSmartphone}" th:object="${smartphone}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Marque</label>
                            <input type="text" th:field="*{brand}" class="form-control" placeholder="Ex: Apple"
                                required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nom du modèle</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Ex: iPhone 13"
                                required />
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Prix</label>
                            <div class="input-group">
                                <input type="number" step="0.01" th:field="*{price}" class="form-control"
                                    placeholder="0.00" required />
                                <span class="input-group-text">€</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Prix Neuf</label>
                            <div class="input-group">
                                <input type="number" step="0.01" th:field="*{newPrice}" class="form-control"
                                    placeholder="0.00" required />
                                <span class="input-group-text">€</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock</label>
                            <input type="number" th:field="*{stock}" class="form-control" placeholder="Quantité"
                                required />
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Couleur</label>
                            <select th:field="*{color}" class="form-select">
                                <option value="" disabled selected>Choisir...</option>
                                <option th:each="option : ${couleurs}" th:value="${option.key}"
                                    th:text="${option.value}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Stockage</label>
                            <select th:field="*{storageCapacity}" class="form-select">
                                <option value="" disabled selected>Choisir...</option>
                                <option th:each="option : ${stockages}" th:value="${option.key}"
                                    th:text="${option.value}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">État</label>
                            <select th:field="*{condition}" class="form-select" required>
                                <option value="" disabled selected>Choisir...</option>
                                <option th:each="option : ${conditions}" th:value="${option.key}"
                                    th:text="${option.value}"></option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">URL Image</label>
                            <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://..."
                                required />
                        </div>

                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-dark">Enregistrer</button>
                        <a th:href="@{/dashboard}" class="btn btn-link text-dark text-decoration-none ms-2">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
