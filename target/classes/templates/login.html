<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Retour Marché</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
</head>

<body>

<th:block th:replace="~{fragments/head :: header}"></th:block>

<main class="d-flex justify-content-center mt-4">
    <div class="container" style="max-width: 420px;">

        <div th:if="${error}" class="alert alert-danger text-center mb-3">
            <span th:text="${error}"></span>
        </div>

        <div th:if="${success}" class="alert alert-success text-center mb-3">
            <span th:text="${success}"></span>
        </div>

        <ul class="nav nav-tabs justify-content-center" id="loginTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        th:classappend="${showRegister} ? '' : 'active'"
                        id="connexion-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#connexion"
                        type="button"
                        role="tab">
                    Connexion
                </button>
            </li>

            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        th:classappend="${showRegister} ? 'active' : ''"
                        id="inscription-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#inscription"
                        type="button"
                        role="tab">
                    Inscription
                </button>
            </li>
        </ul>

        <div class="tab-content mb-4" id="loginTabsContent">

            <div class="tab-pane fade"
                 th:classappend="${showRegister} ? '' : 'show active'"
                 id="connexion"
                 role="tabpanel">
                <div class="card shadow-sm p-4 d-flex align-items-center justify-content-center" style="min-height: 450px;">
                    <div class="w-100">
                        <h4 class="text-center mb-3">Connexion</h4>

                        <form method="post" th:action="@{/login}" class="w-75 mx-auto">
                            <input type="email" class="form-control border-dark mb-3" name="email" placeholder="Adresse email" required>
                            <input type="password" class="form-control border-dark mb-3" name="password" placeholder="Mot de passe" required>
                            <button class="btn btn-dark w-100 mt-2" type="submit">Se connecter</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade"
                 th:classappend="${showRegister != null && showRegister} ? 'show active' : ''"
                 id="inscription"
                 role="tabpanel">
                <div class="card shadow-sm p-4 d-flex align-items-center justify-content-center" style="min-height: 450px;">
                    <div class="w-100">
                        <h4 class="text-center mb-3">Inscription</h4>

                        <form method="post" th:action="@{/register}" class="w-75 mx-auto">
                            <div th:if="${error != null && (showRegister != null && showRegister)}" class="alert alert-danger p-2 text-center mb-3" style="font-size: 0.85rem;">
                                <span th:text="${error}"></span>
                            </div>
                            <input type="text" class="form-control border-dark mb-3" name="nom" th:value="${user != null ? user.nom : ''}" placeholder="Nom" required>
                            <input type="text" class="form-control border-dark mb-3" name="prenom" th:value="${user != null ? user.prenom : ''}" placeholder="Prénom" required>
                            <input type="email" class="form-control border-dark mb-3" name="email" th:value="${user != null ? user.email : ''}" placeholder="Adresse email" required>
                            <input type="password" class="form-control border-dark mb-3" name="password" placeholder="Mot de passe" required>
                            <input type="password" class="form-control border-dark mb-3" name="passwordConfirm" placeholder="Confirmer mot de passe" required>
                            <input type="tel" class="form-control border-dark mb-3" name="telephone" th:value="${user != null ? user.telephone : ''}" placeholder="Numéro de téléphone" required>
                            <button class="btn btn-dark w-100 mt-2" type="submit">S'inscrire</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

</body>
</html>
