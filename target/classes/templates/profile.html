<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head"></head>

<body>

    <header th:replace="fragments/head :: header"></header>

    <main class="container py-5">

        <h1 class="mb-4">Mon profil</h1>

        <div class="row">
            <section class="col-md-6">

                <div class="card shadow-sm">
                    <div class="card-body d-flex align-items-center">

                        <!-- Avatar rond avec initiale -->
                        <div class="avatar me-3">
                            <span th:text="${user.prenom.substring(0,1).toUpperCase()}">B</span>
                        </div>

                        <div>
                            <h4 class="mb-1" th:text="${user.prenom + ' ' + user.nom}">
                                Prénom Nom
                            </h4>
                            <p class="mb-1 text-muted">
                                Rôle :
                                <span th:text="${user.role}">USER</span>
                            </p>
                            <p class="mb-0">
                                Email :
                                <span th:text="${user.email}">email@example.com</span>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-body">
                        <h5 class="card-title">Informations complémentaires</h5>
                        <p class="mb-1">
                            Téléphone :
                            <span th:text="${user.telephone}">06 12 34 56 78</span>
                        </p>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Gestion des Commandes</h5>
                        <div th:if="${#lists.isEmpty(orders)}" class="text-muted">
                            Aucune commande passée pour le moment.
                        </div>
                        <div th:unless="${#lists.isEmpty(orders)}" class="list-group list-group-flush">
                            <a th:each="order : ${orders}" th:href="@{/order/{id}(id=${order.id})}"
                                class="list-group-item d-flex justify-content-between align-items-center px-0">
                                <div>
                                    <h6 class="mb-1 fw-bold">Commande n° <span th:text="${order.id}">123</span></h6>
                                    <small class="text-muted">
                                        <span
                                            th:text="${#temporals.format(order.orderDate, 'dd MMMM yyyy à HH:mm')}">Date</span>
                                    </small>
                                </div>
                                <div class="d-flex align-items-center">
                                    <span th:if="${order.status == 'PAID'}" class="badge bg-success me-3">Payé</span>
                                    <span th:if="${order.status == 'PENDING_PAYMENT'}" class="badge bg-warning text-dark me-3">En attente</span>
                                    <span th:if="${order.status == 'FAILED'}" class="badge bg-danger me-3">Échoué</span>
                                    <span th:if="${order.status == 'CONFIRMED' && order.paymentMethod == 'CASH_ON_DELIVERY'}" class="badge bg-primary me-3">A payer à la livraison</span>
                                    <i class="bi bi-chevron-right text-muted"></i>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <footer th:replace="fragments/head :: footer"></footer>

</body>

</html>
