services:
  - type: web
    name: shop-app
    env: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: shop-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: shop-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: shop-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: shop-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: shop-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: none
      - key: SPRING_FLYWAY_ENABLED
        value: "true"

databases:
  - name: shop-db
    plan: free
    region: frankfurt
    databaseName: shop
    user: shopuser
